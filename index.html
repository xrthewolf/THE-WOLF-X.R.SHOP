<style>
:root{--bg:#050505;--cd:rgba(22,18,10,.82);--tx:#f6edd8;--mu:#a69a7c;--c:#ffc94d;--m:#ff7a18;--g:#39ff88;--r:#ff4d6d;--y:#ffd24d;--bd:rgba(255,201,77,.22);color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;max-width:680px;margin:auto;padding:calc(12px + env(safe-area-inset-top)) 14px calc(96px + env(safe-area-inset-bottom));line-height:1.8;
background-image:radial-gradient(600px 320px at 100% -5%,rgba(255,122,24,.22),transparent),radial-gradient(520px 320px at 0 8%,rgba(255,201,77,.18),transparent),linear-gradient(rgba(255,201,77,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,201,77,.045) 1px,transparent 1px);background-size:auto,auto,30px 30px,30px 30px;background-attachment:fixed}
body:after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px);z-index:50;opacity:.5}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-top:12px;backdrop-filter:blur(10px)}
h1{font-size:30px;font-weight:800;letter-spacing:1px;color:var(--c);text-shadow:0 0 12px var(--c),0 0 32px rgba(255,201,77,.5);position:relative;display:inline-block}
h1:before,h1:after{content:attr(data-t);position:absolute;inset:0;overflow:hidden}
h1:before{color:var(--m);text-shadow:none;left:2px;clip-path:inset(0 0 55% 0);animation:gl 3.2s infinite steps(1)}
h1:after{color:var(--g);text-shadow:none;left:-2px;clip-path:inset(60% 0 0 0);animation:gl 2.6s infinite steps(1) reverse}
@keyframes gl{0%,86%,100%{transform:none;opacity:0}88%{transform:translate(3px,-1px);opacity:.8}92%{transform:translate(-3px,1px);opacity:.8}}
h2{font-size:14px;color:var(--c);margin-bottom:8px;text-shadow:0 0 10px rgba(255,201,77,.4)}
.mu{color:var(--mu);font-size:12px}.ok{color:var(--g)}.no{color:var(--r)}.pd{color:var(--y)}
.ad{margin-top:10px;padding:10px 14px;border:1px solid var(--m);border-radius:14px;background:rgba(255,122,24,.1);box-shadow:0 0 18px rgba(255,122,24,.3);font-size:13px;animation:pl 2.4s infinite}
@keyframes pl{50%{box-shadow:0 0 6px rgba(255,122,24,.15)}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{padding:16px 6px;text-align:center;border:1px solid var(--bd);border-radius:16px;background:var(--cd);font-weight:700;color:var(--tx);text-decoration:none;display:block;cursor:pointer}
.tile:active{box-shadow:0 0 18px var(--c)}.tile i{display:block;font-style:normal;font-size:26px}
details{border:1px solid var(--bd);border-radius:14px;margin-top:8px;background:rgba(0,0,0,.25);overflow:hidden}
summary{padding:12px 14px;cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between}
summary:after{content:"▾";color:var(--c);transition:transform .3s}details[open] summary:after{transform:rotate(180deg)}
details[open]{border-color:var(--c);box-shadow:0 0 16px var(--bd)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 14px;border-top:1px dashed var(--bd);font-size:13px;align-items:center}
.kv b{color:var(--g);white-space:nowrap}
.row{display:flex;flex-wrap:wrap;gap:8px}
.chip{flex:1 1 45%;padding:10px 8px;text-align:center;border:1px solid var(--bd);border-radius:14px;background:var(--cd);cursor:pointer;font-size:13px}
.chip small{display:block;color:var(--mu);font-size:11px}.chip.on{border-color:var(--c);box-shadow:0 0 16px var(--bd),inset 0 0 12px var(--bd);font-weight:700}
input,textarea,select{width:100%;padding:11px;border-radius:12px;border:1px solid var(--bd);background:rgba(0,0,0,.4);color:var(--tx);font:inherit;font-size:14px;margin-top:6px}
input:focus,textarea:focus{outline:0;border-color:var(--c);box-shadow:0 0 12px var(--bd)}
.l{font-size:12px;color:var(--mu);margin-top:10px}
.btn{width:100%;padding:12px;border:0;border-radius:14px;font:inherit;font-weight:800;font-size:15px;color:#031018;background:linear-gradient(90deg,var(--c),var(--g));margin-top:12px;box-shadow:0 0 20px var(--bd);cursor:pointer}
.btn.s{width:auto;padding:6px 13px;font-size:12px;margin:0}.btn.r{background:linear-gradient(90deg,var(--r),var(--m));color:#fff}
.btn.o{background:transparent;color:var(--c);border:1px solid var(--c);box-shadow:none}.btn:disabled{opacity:.35}
.big{font-size:26px;font-weight:800;color:var(--g);text-shadow:0 0 14px rgba(57,255,136,.5)}
nav{position:fixed;inset:auto 10px calc(10px + env(safe-area-inset-bottom)) 10px;max-width:660px;margin:auto;display:flex;gap:4px;padding:6px;border:1px solid var(--bd);border-radius:20px;background:rgba(10,8,3,.95);backdrop-filter:blur(14px);z-index:60}
nav a{flex:1;text-align:center;padding:9px 2px;border-radius:14px;color:var(--mu);font-size:12.5px;text-decoration:none;position:relative}
nav a.on{background:linear-gradient(90deg,var(--bd),rgba(255,122,24,.25));color:#fff}
nav a em{position:absolute;top:0;left:18%;background:var(--r);color:#fff;border-radius:99px;font-size:10px;font-style:normal;padding:0 6px;box-shadow:0 0 10px var(--r)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0;margin-top:12px}
.tabs button{flex:0 0 auto;padding:8px 13px;border-radius:99px;border:1px solid var(--bd);background:var(--cd);color:var(--mu);font:inherit;font-size:12.5px;cursor:pointer}
.tabs button.on{color:#fff;border-color:var(--c);box-shadow:0 0 12px var(--bd)}
.tag{padding:1px 10px;border-radius:99px;border:1px solid;font-size:11px;white-space:nowrap}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cp{word-break:break-all;direction:ltr;text-align:left;font-size:12px;color:var(--c);background:rgba(0,0,0,.4);border:1px dashed var(--bd);border-radius:10px;padding:9px;margin-top:6px}
.mt{height:16px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid var(--bd);overflow:hidden;margin-top:10px}
.mt i{display:block;height:100%;width:0;border-radius:99px;background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(0,0,0,.35) 9px 11px),linear-gradient(90deg,var(--c),var(--m));box-shadow:0 0 18px var(--c),0 0 34px rgba(255,122,24,.5);transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.mt.hot i{background:linear-gradient(90deg,var(--m),var(--r));box-shadow:0 0 18px var(--r)}
.tm{display:flex;gap:8px;direction:ltr;margin-top:10px}.tm div{flex:1;text-align:center;padding:10px 2px;border:1px solid var(--bd);border-radius:14px;background:rgba(0,0,0,.3);font-size:22px;font-weight:800;color:var(--g);text-shadow:0 0 12px rgba(57,255,136,.5)}
.tm small{display:block;font-size:10px;color:var(--mu);font-weight:400}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:6px;background:var(--g);box-shadow:0 0 8px var(--g)}.dot.w{background:var(--y);box-shadow:0 0 8px var(--y)}
#ts{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#14100a;border:1px solid var(--c);padding:10px 18px;border-radius:14px;font-size:13px;z-index:99;box-shadow:0 0 20px var(--bd);opacity:0;pointer-events:none;transition:opacity .25s}#ts.on{opacity:1}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:98;padding:16px}#lb.on{display:flex}#lb img{max-width:100%;max-height:100%;border-radius:14px;border:1px solid var(--c)}
.th{width:54px;height:54px;object-fit:cover;border-radius:10px;border:1px solid var(--bd);cursor:pointer}
.orb{position:fixed;width:320px;height:320px;border-radius:50%;filter:blur(90px);opacity:.26;pointer-events:none;z-index:-1;animation:fl 14s ease-in-out infinite}
.o1{background:var(--c);top:-80px;right:-80px}.o2{background:var(--m);bottom:-100px;left:-100px;animation-delay:-7s}@keyframes fl{50%{transform:translate(30px,40px)}}
.hero{position:relative;text-align:center;padding:30px 12px 22px;margin-top:8px;border:1px solid var(--bd);border-radius:24px;background:linear-gradient(180deg,rgba(255,201,77,.08),rgba(255,122,24,.07));overflow:hidden;box-shadow:0 0 40px rgba(255,201,77,.08)}
.hero:before{content:"";position:absolute;left:-30%;right:-30%;bottom:-45%;height:75%;background:linear-gradient(var(--bd) 1px,transparent 1px),linear-gradient(90deg,var(--bd) 1px,transparent 1px);background-size:34px 34px;transform:perspective(220px) rotateX(62deg);animation:gr 3s linear infinite;opacity:.55}@keyframes gr{to{background-position:0 34px}}
